      <line x1="0" y1="70" x2="700" y2="70" stroke="#1e293b" stroke-dasharray="4 4"/>
      <text x="-8" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="end">75k</text>

      <line x1="0" y1="140" x2="700" y2="140" stroke="#1e293b" stroke-dasharray="4 4"/>
      <text x="-8" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="end">50k</text>

      <line x1="0" y1="210" x2="700" y2="210" stroke="#1e293b" stroke-dasharray="4 4"/>
      <text x="-8" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="end">25k</text>

      <line x1="0" y1="280" x2="700" y2="280" stroke="#334155" stroke-width="1"/>
      <text x="-8" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="end">0</text>

      <!-- Month Labels -->
      <text x="40" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Jan</text>
      <text x="150" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Feb</text>
      <text x="260" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Mar</text>
      <text x="370" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Apr</text>
      <text x="480" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">May</text>
      <text x="590" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Jun</text>
      <text x="680" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Jul</text>

      <!-- Area fill path -->
      <path d="M 30 220 C 100 200, 150 160, 220 180 C 290 200, 350 90, 420 110 C 490 130, 560 50, 630 65 C 660 70, 680 40, 690 35 L 690 280 L 30 280 Z" fill="url(#chartAreaGrad)"/>

      <!-- Smooth Area Curve Line -->
      <path d="M 30 220 C 100 200, 150 160, 220 180 C 290 200, 350 90, 420 110 C 490 130, 560 50, 630 65 C 660 70, 680 40, 690 35" fill="none" stroke="url(#chartLineGrad)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Secondary Comparison Curve -->
      <path d="M 30 245 C 100 230, 150 210, 220 225 C 290 240, 350 180, 420 195 C 490 210, 560 160, 630 150 C 660 145, 680 135, 690 130" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

